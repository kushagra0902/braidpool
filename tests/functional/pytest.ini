[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short

markers =
    requires_bitcoin: test requires a running Bitcoin Core binary (deselect with -m 'not requires_bitcoin')
    requires_braidpool: test requires a running Braidpool node binary (deselect with -m 'not requires_braidpool')
    requires_miner: test requires a cpuminer (minerd) binary (deselect with -m 'not requires_miner')
